[project]
name = "botaoshape-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "Django>=6.1.2,<7",
    "celery>=5.6.3,<6",
    "dj-database-url>=3.1.2,<4",
    "django-celery-logs>=0.2.1,<1",
    "django-cors-headers>=4.9,<5",
    "django-filter>=26.2,<27",
    "django-redis>=7,<8",
    "djangorestframework>=3.18.3,<4",
    "python-dotenv>=1.2.4,<2",
    "redis>=8.1,<9",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.3.6,<4"]

[dependency-groups]
test = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1,<8",
    "pytest-django>=4.14,<5",
    "pytest-xdist>=3.8,<4",
]

[tool.uv]
package = false
