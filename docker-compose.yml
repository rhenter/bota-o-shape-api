services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: botaoshape
      POSTGRES_USER: botaoshape
      POSTGRES_PASSWORD: botaoshape
    ports:
      - "5432:5432"
    volumes:
      - botaoshape_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botaoshape -d botaoshape"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  botaoshape_postgres:
